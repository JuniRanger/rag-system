name: Deploy Develop

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy
        run: echo "Deploying to develop"
      - name: Actualizar repositorio
        shell: pwsh
        run: |
          Set-Location C:\rag-system

          git fetch origin
          git checkout develop
          git reset --hard origin/develop

          git log -1 --oneline
